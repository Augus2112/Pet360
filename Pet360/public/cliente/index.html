<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet360 - Catálogo de Productos</title>
    <link rel="stylesheet" href="css/cliente.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <h1>Pet360 Tienda</h1>
        </div>
        <button class="cart-icon-btn" id="openCartBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span>Carrito</span>
            <span class="cart-count" id="cartBadge">0</span>
        </button>
    </header>

    <main class="container">
        <!-- Buscador y Filtros -->
        <section class="controls-section">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar productos para tu mascota...">
            </div>
            <div class="category-filters" id="categoryFilters">
                <button class="btn-filter active" data-category="todos">Todos</button>
            </div>
        </section>

        <!-- Grilla de Productos -->
        <section class="products-grid" id="productsGrid">
            <!-- Los productos se cargan dinámicamente aquí -->
        </section>
    </main>

    <!-- Modal del Carrito y Formulario de WhatsApp -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <button class="close-modal" id="closeCartModal">&times;</button>
            <h2>Tu Carrito de Pedido</h2>
            <div class="cart-items-list" id="cartItemsList"></div>
            <div class="cart-total" id="cartTotalText">Total: $0.00</div>

            <hr style="margin:1rem 0; border:0; border-top:1px solid #eee;">

            <h3>Datos para el envío</h3>
            <form id="checkoutForm" style="margin-top:0.8rem;">
                <div class="form-group">
                    <label for="clientName">Nombre completo:</label>
                    <input type="text" id="clientName" required placeholder="Ej. Carlos Pérez">
                </div>
                <button type="submit" class="btn-whatsapp">Enviar Pedido por WhatsApp</button>
            </form>
        </div>
    </div>

    <script src="js/cliente.js"></script>
</body>
</html>
